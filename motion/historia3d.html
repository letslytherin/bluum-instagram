<!doctype html>
<html lang="pt-BR">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@500;600;800;900&display=block" rel="stylesheet">

<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<style>
  html, body, #stage { width: 1080px; height: 1920px; }
  #cam { position: absolute; inset: 0; transform-origin: 50% 55%; }
  #gl { position: absolute; inset: 0; }

  .tag .k { font: 800 42px Montserrat, sans-serif; letter-spacing: .12em; color: #1d1d1f; margin-top: 30px; }

      linear-gradient(180deg, #fff1b0 0%, #f2cd5b 20%, #c88f1a 46%, #8a5a07 56%, #d9a93d 76%, #fbe39a 100%);
    background-size: 260% 100%, 100% 100%; background-repeat: no-repeat; -webkit-background-clip: text; background-clip: text; color: transparent; padding: .06em .1em;
    filter: drop-shadow(0 3px 0 #7a5208) drop-shadow(0 10px 16px rgba(0,70,64,.3)); }

  #cap { position: absolute; left: 70px; right: 70px; top: 1490px; text-align: center; font: 900 64px/1.16 Montserrat, sans-serif; color: #fff;
    -webkit-text-stroke: 12px #1d1d1f; paint-order: stroke fill; }
  #cap span { display: inline-block; margin: 0 .12em; }
  #cap .on { color: #ffd23f; transform: scale(1.08); }
  #cap .who { display: block; font-size: 34px; letter-spacing: .2em; -webkit-text-stroke: 8px #1d1d1f; margin-bottom: 6px; }
  #cap.narr { font-style: italic; }
</style>

<body>
<div id="stage">
  <div id="cam">
    <div id="gl"></div>
    <canvas id="dust" width="1080" height="1920" style="position:absolute;inset:0"></canvas>
  </div>
  <div id="cap"></div>
</div>
<script src="brand.js"></script>
<script src="audio.js"></script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { makePitanga, makeCaju, updateChar } from './frutas3d.js';

// Mesma história e vozes da versão em desenho (historia.html), agora em 3D.
const LINES = [
  { id: 'n1', who: 'N', cap: 'A Pitanga só queria se sentir mais bonita...', gap: 0.5 },
  { id: 'p1', who: 'P', cap: 'R$ 89,90 num batom? Não dá...', gap: 0.3 },
  { id: 'p2', who: 'P', cap: 'R$ 60 num brinco...', gap: 1.0 },
  { id: 'p3', who: 'P', cap: 'Nada pra mim hoje...', gap: 1.0 },
  { id: 'n2', who: 'N', cap: 'Até que ela encontrou a BLUUM.', gap: 0.9 },
  { id: 'c1', who: 'C', cap: 'Seja bem-vinda! Aqui é tudo A PARTIR DE R$ 4,99!', gap: 0.8 },
  { id: 'p4', who: 'P', cap: 'R$ 4,99?!', gap: 0.25 },
  { id: 'p5', who: 'P', cap: 'Gente, me sinto OUTRA FRUTA!', gap: 2.7 },
  { id: 'n3', who: 'N', cap: 'BLUUM. Inauguração sábado, 07/11, em Olinda. VEM AÍ!', gap: 0.6 },
];
const FPS = 30, $ = id => document.getElementById(id), camDiv = $('cam');
const S = Object.fromEntries(LINES.map(l => [l.id, l]));
const STORES = [
  { id: 's1', name: 'BOUTIQUE CARÍSSIMA', wall: '#d9d1c6', floor: '#a49a8e', plaque: ['#1d1d1f', '#cfc7b8'], tag: ['BATOM', 'R$ 89,90'] },
  { id: 's2', name: 'CHIQUE DEMAIS', wall: '#dccbce', floor: '#97858a', plaque: ['#3b1d2a', '#e8cfd6'], tag: ['BRINCO', 'R$ 59,90'] },
  { id: 's3', name: 'SÓ PRA RICA', wall: '#c8d0d7', floor: '#87919b', plaque: ['#14213d', '#d6dde6'], tag: ['SKINCARE', 'R$ 149,90'] },
];

// ---------------- 3D ----------------
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(1080, 1920);
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
R.toneMapping = THREE.NeutralToneMapping; R.toneMappingExposure = 1.0;
$('gl').appendChild(R.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const camera = new THREE.PerspectiveCamera(26, 1080 / 1920, 0.1, 60);
const hemi = new THREE.HemisphereLight('#ffffff', '#8a8a8a', 0.8); scene.add(hemi);
const key = new THREE.DirectionalLight('#ffffff', 2.2); key.position.set(2.5, 5, 4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -4; key.shadow.camera.right = 4; key.shadow.camera.top = 4; key.shadow.camera.bottom = -2; key.shadow.radius = 6; key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight('#bfe9ff', 1.0); rim.position.set(-3, 3, -2); scene.add(rim);

const std = (color, rough = 0.7, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, ...extra });
const box = (w, h, d, mat, r = 0.02) => { const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, r), mat); m.castShadow = true; m.receiveShadow = true; return m; };
function textTex(txt, bg, fg, w = 1024, h = 220, font = '700 96px Cinzel') {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, w, h); x.fillStyle = fg; x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.letterSpacing = '10px'; x.fillText(txt, w / 2, h / 2 + 6);
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx;
}
function room(wall, floor, floorRough = 0.8) {
  const g = new THREE.Group();
  const w = new THREE.Mesh(new THREE.PlaneGeometry(12, 8), std(wall, 0.9)); w.position.set(0, 3, -1.3); w.receiveShadow = true; g.add(w);
  const f = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), std(floor, floorRough)); f.rotation.x = -Math.PI / 2; f.receiveShadow = true; g.add(f);
  return g;
}
function shelfRow(g, y, cols, n, seed, z = -1.05) {
  const sh = box(3.4, 0.06, 0.4, std('#6f655b', 0.6)); sh.position.set(0, y, z); g.add(sh);
  let r = seed; const rnd = () => (r = (r * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < n; i++) {
    const x = -1.5 + (i + 0.5) * (3 / n) + (rnd() - 0.5) * 0.08, h = 0.14 + rnd() * 0.2, col = cols[Math.floor(rnd() * cols.length)];
    const m = rnd() < 0.5 ? new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, h, 20), new THREE.MeshPhysicalMaterial({ color: col, roughness: 0.25, clearcoat: 1 }))
                          : box(0.1, h, 0.08, new THREE.MeshPhysicalMaterial({ color: col, roughness: 0.3, clearcoat: 0.6 }), 0.015);
    m.position.set(x, y + 0.03 + h / 2, z); m.castShadow = true; g.add(m);
  }
}
const SETS = {};
STORES.forEach((st, i) => {
  const g = room(st.wall, st.floor);
  const pl = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.42, 0.05), [std(st.plaque[0]), std(st.plaque[0]), std(st.plaque[0]), std(st.plaque[0]),
    new THREE.MeshStandardMaterial({ map: textTex(st.name, st.plaque[0], st.plaque[1], 1200, 210, '700 74px Cinzel'), roughness: 0.5 }), std(st.plaque[0])]);
  pl.position.set(0, 3.12, -1.25); pl.castShadow = true; g.add(pl);
  shelfRow(g, 1.95, ['#8c1d2a', '#2e2e33', '#d8c3a5', '#b23a48', '#3b3b3b', '#c9a77c'], 9, 11 + i * 7);
  shelfRow(g, 2.6, ['#8c1d2a', '#2e2e33', '#d8c3a5', '#b23a48', '#3b3b3b', '#c9a77c'], 8, 31 + i * 5);
  SETS[st.id] = g;
});
// nuvem de chuva (3ª loja)
const cloud = new THREE.Group();
{ const cm = std('#8d99a6', 0.9); [[0, 0, 0.32], [-0.3, -0.05, 0.24], [0.32, -0.04, 0.26], [-0.12, 0.16, 0.24], [0.16, 0.14, 0.22]].forEach(([x, y, r]) => { const s = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 18), cm); s.position.set(x, y, 0); s.castShadow = true; cloud.add(s); }); }
const drops = []; const dm = new THREE.MeshPhysicalMaterial({ color: '#7fb6e0', roughness: 0.1, clearcoat: 1 });
for (let i = 0; i < 14; i++) { const d = new THREE.Mesh(new THREE.CapsuleGeometry(0.012, 0.08, 4, 8), dm); d.userData = { x: -0.45 + (i % 7) * 0.15, ph: i * 0.37 }; cloud.add(d); drops.push(d); }
SETS.s3.add(cloud);
// fachada da Bluum
{
  const g = room('#6dc8bf', '#5bb3aa', 0.6);
  const white = std('#ffffff', 0.4), dark = std('#0d4c46', 0.5);
  const fr = [[0, 2.25, 2.3, 0.1], [-1.1, 1.1, 0.1, 2.3], [1.1, 1.1, 0.1, 2.3], [0, 1.1, 0.06, 2.3]];
  fr.forEach(([x, y, w, h]) => { const m = box(w, h, 0.12, dark, 0.01); m.position.set(x, y, -1.2); g.add(m); });
  [-0.55, 0.55].forEach(x => { const gl = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 2.2), new THREE.MeshPhysicalMaterial({ color: '#d9f7f3', roughness: 0.05, metalness: 0, clearcoat: 1, transparent: true, opacity: 0.85 })); gl.position.set(x, 1.1, -1.24); g.add(gl); });
  const wall2 = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 2.3), white); wall2.position.set(0, 1.12, -1.27); g.add(wall2);
  SETS.front = g;
}
// dentro da Bluum
{
  const g = room('#6dc8bf', '#eef8f6', 0.35);
  for (let y = 0.9; y < 4.2; y += 0.14) { const s = box(5, 0.03, 0.03, std('#ffffff', 0.5, { transparent: true, opacity: 0.55 }), 0.01); s.castShadow = false; s.position.set(0, y, -1.27); g.add(s); }
  const sh = std('#ffffff', 0.35); [1.35].forEach(y => { const m = box(3.4, 0.05, 0.36, sh); m.position.set(0, y, -1.05); g.add(m); });
  shelfRow(g, 1.35, ['#e2557a', '#f2c94c', '#ffffff', '#c24a6e', '#8fd3cb', '#f08a6c', '#fbe39a'], 12, 3);
  g.children.filter(m => m.geometry && m.geometry.type === 'RoundedBoxGeometry' && m.material.color && m.material.color.getHexString() === '6f655b').forEach(m => m.material = sh);
  SETS.inside = g;
}
SETS.fim = room('#6dc8bf', '#6dc8bf', 0.9);
Object.values(SETS).forEach(g => { g.visible = false; scene.add(g); });
const P = makePitanga(), C = makeCaju(); scene.add(P.root, C.root);

const LIGHT = {
  s1: { hemi: 0.55, key: 1.6, keyC: '#dfe6ff', exp: 0.9 }, s2: { hemi: 0.5, key: 1.5, keyC: '#e6dfff', exp: 0.88 }, s3: { hemi: 0.45, key: 1.3, keyC: '#cfdcff', exp: 0.82 },
  front: { hemi: 0.8, key: 2.2, keyC: '#fff4dc', exp: 0.9 }, inside: { hemi: 0.9, key: 2.2, keyC: '#fff4dc', exp: 0.92 }, fim: { hemi: 0.85, key: 2.1, keyC: '#fff4dc', exp: 0.9 },
};

// ---------------- sobreposições 2D (texto nítido) ----------------
const EL = {};
function mk(id, html, cls = 'a') { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; camDiv.insertBefore(d, $('dust')); EL[id] = d; return d; }
const show = (el, o) => { el.style.opacity = o; el.style.visibility = o <= 0.001 ? 'hidden' : 'visible'; };
function slamIn(el, t, at, out, { x = 540, y = 960, r = 0, s0 = 2.2 } = {}) {
  const k = p(t, at, at + 0.18), ko = out != null ? p(t, out, out + 0.18) : 0;
  if (t < at || ko >= 1) { show(el, 0); return; }
  place(el, { x, y: y - 40 * ko, r, s: lerp(s0, 1, eExpo(k)) * (1 - 0.2 * ko), o: Math.min(1, k * 3) * (1 - ko) });
}
function riseIn(el, t, at, y, x = 540) { const k = eOut(p(t, at, at + 0.4)); if (t < at) return show(el, 0); place(el, { x, y: y + 30 * (1 - k), o: k }); }

let T = {}, dust;
window.FPS = FPS;
window.ready = (async () => {
  await Promise.all([document.fonts.load('900 100px Cinzel'), document.fonts.load('700 92px Cinzel'), document.fonts.load('900 60px Montserrat'), document.fonts.load('800 40px Montserrat')]);
  // refaz as placas agora que a fonte carregou
  STORES.forEach(st => SETS[st.id].children.forEach(m => { if (Array.isArray(m.material)) { m.material[4].map = textTex(st.name, st.plaque[0], st.plaque[1], 1200, 210, '700 74px Cinzel'); m.material[4].needsUpdate = true; } }));
  const ac = new OfflineAudioContext(1, 44100, 44100);
  let cur = 0;
  for (const L of LINES) {
    const buf = await ac.decodeAudioData(await (await fetch(`assets/voz/historia/${L.id}.mp3`)).arrayBuffer());
    const d = buf.getChannelData(0), sr = buf.sampleRate, th = 0.0056;
    let a = 0, b = d.length - 1;
    while (a < d.length && Math.abs(d[a]) < th) a++;
    while (b > a && Math.abs(d[b]) < th) b--;
    const step = Math.round(sr / FPS), env = [];
    for (let i = a; i < b; i += step) { let s = 0; for (let j = i; j < Math.min(b, i + step); j++) s += d[j] * d[j]; env.push(Math.sqrt(s / step)); }
    const mx = Math.max(...env); L.env = env.map(v => Math.min(1, v / (mx * 0.75)));
    L.t0 = cur + L.gap; L.t1 = L.t0 + (b - a) / sr; cur = L.t1;
  }
  T = { s1: 0, s2: S.p2.t0 - 0.75, s3: S.p3.t0 - 0.75, front: S.n2.t0 - 0.35, inside: S.c1.t0 - 0.55, fim: S.n3.t0 - 0.4, end: S.n3.t1 + 1.6 };
  T.compra = S.p4.t1 + 0.35;
  window.DURATION = Math.ceil(T.end * 10) / 10;
  window.VOICES = LINES.map(L => [`assets/voz/historia/${L.id}.mp3`, L.t0, L.who === 'N' ? 1 : L.who === 'P' ? 3 : 2, false]);
  window.AUDIO_SPEC = { bpm: 100, dur: window.DURATION, kick: 0.45, drums: [[T.front + 0.3, T.end - 1]], quietBar: -1, risers: [[T.s3 + 1.5, T.front]],
    booms: [[T.front, 0.5], [S.p4.t0, 0.4], [T.fim, 0.4]], whooshes: [T.s2 - 0.2, T.s3 - 0.2, T.inside - 0.2, T.fim - 0.2],
    chimes: [[84, T.front + 0.1, 0.1], [89, T.front + 0.15, 0.07], [88, S.c1.t0 + 0.68 * (S.c1.t1 - S.c1.t0), 0.1],
             [81, T.compra, 0.09], [84, T.compra + 0.5, 0.09], [88, T.compra + 1.0, 0.09], [93, T.compra + 1.5, 0.1], [96, S.p5.t0 + 0.2, 0.07], [77, T.fim + 0.3, 0.1]] };

  const logo = await keyLogo();
  STORES.forEach(st => mk('tag' + st.id, `<div class="k">${st.tag[0]}</div><div class="v">${st.tag[1]}</div>`, 'a tag'));
  mk('lotusD', `<img src="${logo.lotus.url}" style="width:190px;display:block">`);
  mk('wordD', `<img src="${logo.word.url}" style="width:720px;display:block">`);
  mk('apartir', 'a partir de', 'a mont ink'); EL.apartir.style.cssText += 'font-size:52px;font-weight:600';
  mk('preco', 'R$ 4,99', 'a goldx'); EL.preco.style.fontSize = '210px';
  mk('lotusF', `<img src="${logo.lotus.url}" style="width:260px;display:block">`);
  mk('wordF', `<img src="${logo.word.url}" style="width:860px;display:block">`);
  mk('tagF', `<img src="${logo.tag.url}" style="width:720px;display:block">`);
  mk('dataF', 'SÁBADO · 07/11', 'a'); EL.dataF.style.cssText += "font:900 88px Cinzel,serif;color:#0d4c46";
  mk('endF', 'Estrada de Águas Compridas, 392 · Olinda', 'a mont ink'); EL.endF.style.cssText += 'font-size:38px;font-weight:600';
  mk('vemF', 'VEM AÍ!', 'a goldx'); EL.vemF.style.fontSize = '130px';
  mk('uau', 'UAU!', 'a boom');
  dust = makeParticles($('dust'), { count: 50, seed: 5 });
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  render(0);
  return true;
})();

const lineAt = t => LINES.find(L => t >= L.t0 && t < L.t1);
const envAt = (L, t) => { if (!L) return 0; const i = (t - L.t0) * FPS, a = L.env[Math.floor(i)] || 0, b = L.env[Math.ceil(i)] || 0; return lerp(a, b, i % 1); };
const X = px => (px - 540) / 370; // posição de tela da versão 2D -> metros

function render(t) {
  const L = lineAt(t);
  const order = [['s1', T.s1], ['s2', T.s2], ['s3', T.s3], ['front', T.front], ['inside', T.inside], ['fim', T.fim]];
  const sc = [...order].reverse().find(([, t0]) => t >= t0)[0], st = T[sc];
  Object.entries(SETS).forEach(([k, g]) => { g.visible = k === sc; });
  const lt = LIGHT[sc]; hemi.intensity = lt.hemi; key.intensity = lt.key; key.color.set(lt.keyC); R.toneMappingExposure = lt.exp;

  // câmera: aproximação lenta em cada cena, chicote na troca, soco no "R$ 4,99?!"
  let dist = 10.6 - 0.5 * eInOut(p(t, st, st + 4)), camY = 1.55, lookY = 1.07, camX = 0;
  if (sc === 'fim') { lookY = 1.12; }
  if (t >= S.p4.t0 && sc === 'inside') dist -= 1.4 * Math.exp(-(t - S.p4.t0) * 3.5);
  const sinceCut = t - st, toCut = (order.find(([, t0]) => t0 > t) || [0, 1e9])[1] - t;
  let whip = 0; if (st > 0 && sinceCut < 0.12) whip = (1 - sinceCut / 0.12); if (toCut < 0.12) whip = -(1 - toCut / 0.12);
  camX = whip * 0.9;
  camera.position.set(camX, camY, dist); camera.lookAt(camX * 0.6, lookY, 0);
  $('gl').style.filter = Math.abs(whip) > 0.05 ? `blur(${Math.abs(whip) * 16}px)` : 'none';

  // chuva
  if (sc === 's3') { cloud.visible = t > S.p3.t0 - 0.4; cloud.position.set(X(380), 1.95 + 0.04 * Math.sin(t * 2), 0.2); drops.forEach(d => { d.position.set(d.userData.x, -0.25 - ((t * 1.6 + d.userData.ph) % 0.9), 0.1); }); }

  // pitanga
  const pTalk = L && L.who === 'P', env = pTalk ? envAt(L, t) : 0;
  let x = X(400), walk = 0, emo = 'triste', pose = 'baixo', tears = 0, glow = 0, z = 0, turn = 0;
  if (['s1', 's2', 's3'].includes(sc)) {
    const kw = p(t, st + 0.05, st + 1.2); x = lerp(-2.4, X(400), eOut(kw)); walk = kw < 1 ? 1 : 0; pose = walk ? 'anda' : 'baixo'; turn = walk ? 0.5 : 0.15;
    tears = sc === 's3' ? 1 : sc === 's2' ? 1 : 0;
  } else if (sc === 'front') {
    const kw = p(t, st + 0.05, st + 1.0); x = lerp(-2.4, X(380), eOut(kw)); walk = kw < 1 ? 1 : 0; pose = walk ? 'anda' : 'baixo'; turn = walk ? 0.5 : 0;
    emo = t > S.n2.t0 + 0.6 ? 'surpresa' : 'triste';
  } else if (sc === 'inside') {
    x = X(370); turn = 0.25; emo = t < S.p4.t0 ? (t < S.c1.t0 + 1.2 ? 'surpresa' : 'duvida') : 'brilho'; pose = t < S.p4.t0 ? 'baixo' : 'alto';
    if (t >= T.compra) pose = 'sacolas';
    if (t >= S.p5.t0) pose = 'alto';
    glow = p(t, T.compra + 1.6, T.compra + 2.2);
  } else { x = X(390); z = 0; emo = 'feliz'; pose = 'sacolas'; glow = 0.5; turn = 0.2; }
  const acc = sc === 'inside' ? { bags: p(t, T.compra, T.compra + 0.4), bow: p(t, T.compra + 0.5, T.compra + 0.9), ear: p(t, T.compra + 1.0, T.compra + 1.4), lips: p(t, T.compra + 1.5, T.compra + 1.6) }
            : sc === 'fim' ? { bags: 1, bow: 1, ear: 1, lips: 1 } : {};
  updateChar(P, t, { x, z, s: sc === 'fim' ? 0.75 : 1, emo, env, talking: pTalk, pose, walk, tears, glow, acc, look: 0.5, turn });

  // caju (vendedor)
  const cTalk = L && L.who === 'C';
  C.root.visible = sc === 'inside' || sc === 'fim';
  if (C.root.visible) updateChar(C, t, { x: X(sc === 'fim' ? 720 : 760), z: 0, s: sc === 'fim' ? 0.75 : 1, emo: 'feliz', env: cTalk ? envAt(L, t) : 0, talking: cTalk, pose: cTalk ? 'fala' : sc === 'fim' ? 'tchau' : 'baixo', look: -0.6, turn: -0.3 });

  R.render(scene, camera);

  // sobreposições
  STORES.forEach((s, i) => { const line = [S.p1, S.p2, S.p3][i]; slamIn(EL['tag' + s.id], t, line.t0 - 0.15, (i < 2 ? [T.s2, T.s3][i] : T.front) - 0.1, { x: 690, y: 700, r: i % 2 ? -5 : 5 }); });
  if (sc === 'front') { riseIn(EL.lotusD, t, T.front + 0.2, 230); riseIn(EL.wordD, t, T.front + 0.35, 420); }
  else if (sc === 'inside') {
    riseIn(EL.lotusD, t, T.inside + 0.25, 200); riseIn(EL.wordD, t, T.inside + 0.4, 380);
    const kp = S.c1.t0 + 0.68 * (S.c1.t1 - S.c1.t0);
    riseIn(EL.apartir, t, kp - 0.4, 530); slamIn(EL.preco, t, kp, null, { y: 680 });
    EL.preco.style.backgroundPosition = `${lerp(120, -20, p(t, kp + 0.2, kp + 1))}% 0, 0 0`;
    slamIn(EL.uau, t, S.p5.t0, S.p5.t1 + 0.2, { x: 830, y: 880, r: 8 });
  }
  if (sc !== 'front' && sc !== 'inside') ['lotusD', 'wordD'].forEach(k => show(EL[k], 0));
  if (sc !== 'inside') ['apartir', 'preco', 'uau'].forEach(k => show(EL[k], 0));
  if (sc === 'fim') {
    riseIn(EL.lotusF, t, T.fim + 0.3, 210); riseIn(EL.wordF, t, T.fim + 0.45, 410); riseIn(EL.tagF, t, T.fim + 0.6, 520);
    slamIn(EL.dataF, t, S.n3.t0 + 1.2, null, { y: 630 }); riseIn(EL.endF, t, S.n3.t0 + 2.2, 712);
    slamIn(EL.vemF, t, S.n3.t1 - 1.0, null, { y: 815 });
    EL.vemF.style.backgroundPosition = `${lerp(120, -20, p(t, S.n3.t1 - 0.8, S.n3.t1))}% 0, 0 0`;
  } else ['lotusF', 'wordF', 'tagF', 'dataF', 'endF', 'vemF'].forEach(k => show(EL[k], 0));
  $('dust').style.opacity = ['front', 'inside', 'fim'].includes(sc) ? 1 : 0;
  dust(t, [[T.front + 0.15, 540, 700], [T.compra + 0.4, 400, 1100], [S.p5.t0 + 0.1, 400, 1100], [T.fim + 0.4, 540, 420]]);

  // legenda
  const cap = $('cap');
  const CL = L || [...LINES].reverse().find(x => t >= x.t1 && t < x.t1 + 0.35);
  if (!CL) { cap.innerHTML = ''; return; }
  const words = CL.cap.split(' '), tot = words.reduce((a, w) => a + w.length + 1, 0);
  let a0 = 0; const k = p(t, CL.t0, CL.t1) * tot;
  cap.className = CL.who === 'N' ? 'narr' : '';
  const label = CL.who === 'N' ? '' : `<span class="who" style="color:${CL.who === 'P' ? '#ff8a6a' : '#ffd23f'}">${CL.who === 'P' ? 'PITANGA' : 'CAJU · BLUUM'}</span>`;
  cap.innerHTML = label + words.map(w => { const a = a0; a0 += w.length + 1; return `<span class="${k >= a && k < a0 ? 'on' : ''}" style="opacity:${k >= a - 0.5 || t >= CL.t1 ? 1 : 0}">${w}</span>`; }).join(' ');
}
window.render = render;
</script>
