<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bluum · loja pronta</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=block" rel="stylesheet">
<link href="brand.css" rel="stylesheet">
<style>
  html, body, #stage { width: 1080px; height: 1920px; }
  #fimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  #topfade { position: absolute; left: 0; right: 0; top: 0; height: 520px; background: linear-gradient(180deg, rgba(5,40,37,.45), transparent); }
  #botfade { position: absolute; left: 0; right: 0; bottom: 0; height: 900px; background: linear-gradient(0deg, rgba(5,40,37,.5) 30%, rgba(5,40,37,.45) 55%, transparent); }
  .blk { background: var(--fundo); color: var(--tinta); font: 700 62px/1.22 'Cinzel', serif; padding: 20px 38px 22px; text-align: center; white-space: nowrap;
         box-shadow: 0 10px 30px rgba(0,40,36,.28); }
  .goldx { font-family: 'Cinzel', serif; font-weight: 700; letter-spacing: .03em;
    background-image: linear-gradient(180deg, #fff6c4 0%, #ffe066 16%, #f5bf1f 34%, #c98a06 50%, #8f5a02 58%, #d9a21c 72%, #ffd84a 88%, #fff0a8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; padding: .06em .1em; }
  .wht { font-family: 'Cinzel', serif; font-weight: 700; color: #fff; letter-spacing: .06em; text-shadow: 0 2px 10px rgba(0,30,28,.7); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="fcv" width="1080" height="1920" style="position:absolute;inset:0"></canvas>
  <div id="topfade"></div>
  <div id="botfade"></div>
</div>
<script src="brand.js"></script>
<script>
// Um vídeo só com a loja pronta (6 filmagens do WhatsApp de 06/11). Sem trilha: a música é escolhida no Instagram.
// Ritmo calmo (feedback de 06/11: "meio acelerado"): planos de 3,6 s, câmera a 70% da velocidade
// com quadros mesclados, e fusão de 0,5 s entre um plano e outro.
// Cada plano: [filmagem, quadro inicial, segundos na tela, frase]
const SPEED = 0.8, XF = 0.5;
// filmagens novas de 06/11 (WA0042, WA0044, WA0046). novo1 começa no quadro 100 para não mostrar o reflexo de uma pessoa no vidro.
const SHOTS = [
  ['novo1', 100, 5.5, 'Cabelo e | body splash'],
  ['novo1', 330, 5.5, 'Cuidados | pra pele'],
  ['novo2', 30, 6, 'Acessórios, colares | e brincos'],
  ['novo3', 15, 6, 'Hidratantes | e muito mais'],
];
let acc = 0; SHOTS.forEach((s, i) => { s.t0 = acc; s.t1 = acc + s[2]; acc = s.t1 - (i < SHOTS.length - 1 ? XF : 0); });
window.FPS = 30; window.DURATION = acc; window.VOICES = [];
const GOLD_SH = 'drop-shadow(0 0 1.5px #5a3602) drop-shadow(0 4px 0 #5a3602) drop-shadow(0 10px 18px rgba(0,30,28,.55))';

const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('fcv'), ctx = cv.getContext('2d');
let els = {};

function mk(cls, html, size, extra = {}) {
  const el = document.createElement('div');
  el.className = 'a ' + cls; el.innerHTML = html; el.style.fontSize = size + 'px';
  Object.assign(el.style, extra); stage.appendChild(el);
  let fs = size; while (el.offsetWidth > 990 && fs > 20) { fs -= 2; el.style.fontSize = fs + 'px'; }
  return el;
}

function build(logo) {
  els.frases = SHOTS.map(s => {
    const el = mk('blk', s[3].split(' ').map(w => w === '|' ? '<br>' : `<span style="display:inline-block">${w}</span>`).join(' '), 62);
    return { el, words: [...el.querySelectorAll('span')], s };
  });
  els.lotus = document.createElement('img'); els.lotus.src = logo.lotus.url; els.lotus.className = 'a'; els.lotus.style.width = '150px';
  els.lotus.dataset.filter = 'drop-shadow(0 6px 12px rgba(0,30,28,.5))'; stage.appendChild(els.lotus);
  els.inaug = mk('wht', 'INAUGURAÇÃO', 36, { letterSpacing: '.3em' });
  els.data = mk('goldx', 'SÁBADO · 07/11', 104); els.data.dataset.filter = GOLD_SH;
  els.end = mk('wht', 'Estrada de Águas Compridas, 392 · Olinda', 34);
  els.at = mk('wht', '@lojabluum', 38);
}

const cache = new Map();
async function img(c, n) {
  const k = c + ':' + n; if (cache.has(k)) return cache.get(k);
  const im = new Image(); im.src = `footage/${c}/${String(n).padStart(4, '0')}.jpg`; await im.decode().catch(() => {});
  cache.set(k, im); if (cache.size > 40) cache.delete(cache.keys().next().value); return im;
}
async function drawShot(s, t, alpha) {
  const local = t - s.t0, x = s[1] + local * 30 * SPEED, n = Math.floor(x), fr = x - n;
  const z = 1.03 + 0.05 * p(local, 0, s[2]);            // aproximação lenta, sem soco
  ctx.save(); ctx.translate(540, 960); ctx.scale(z, z); ctx.translate(-540, -960);
  ctx.globalAlpha = alpha; ctx.drawImage(await img(s[0], n + 1), 0, 0, 1080, 1920);
  if (fr > 0.02) { ctx.globalAlpha = alpha * fr; ctx.drawImage(await img(s[0], n + 2), 0, 0, 1080, 1920); }
  ctx.restore();
}
async function render(t) {
  const on = SHOTS.filter(s => t >= s.t0 && t < s.t1);
  if (!on.length) on.push(SHOTS[SHOTS.length - 1]);
  await drawShot(on[0], t, 1);
  if (on[1]) await drawShot(on[1], t, eInOut(p(t, on[1].t0, on[1].t0 + XF)));
  const sh = on[on.length - 1];

  // frase do plano: faixa turquesa abre, palavras sobem, e some antes do corte
  for (const { el, words, s } of els.frases) {
    const local = t - s.t0, len = s[2], last = s === SHOTS[SHOTS.length - 1];
    if (local < 0 || local >= len) { el.style.visibility = 'hidden'; continue; }
    const a = s === SHOTS[0] ? 0.3 : XF * 0.6;
    const k = eInOut(p(local, a, a + 0.6)), ko = last ? 0 : eInOut(p(local, len - XF - 0.45, len - XF + 0.05));
    place(el, { y: 300 + 14 * (1 - k), o: k * (1 - ko) });
    el.style.clipPath = 'none';
    words.forEach(w => { w.style.transform = 'none'; w.style.opacity = 1; });
  }

  // assinatura embaixo
  const rise = (el, y, a) => { const kk = eInOut(p(t, a, a + 0.9)); place(el, { y: y + 18 * (1 - kk), o: kk }); };
  rise(els.lotus, 1230, 0.9);
  rise(els.inaug, 1335, 1.2);
  rise(els.data, 1418, 1.4);
  rise(els.end, 1512, 1.8);
  rise(els.at, 1574, 2.0);
}

// sem trilha: devolve um wav mudo do tamanho do vídeo (a música entra no Instagram)
window.renderAudio = async () => {
  const sr = 44100, n = Math.ceil(window.DURATION * sr), b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  let s = ''; const u = new Uint8Array(b); for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode(...u.subarray(i, i + 8192));
  return btoa(s);
};
window.render = render;
window.ready = (async () => {
  await Promise.all([document.fonts.load('700 100px Cinzel'), document.fonts.load('800 100px Cinzel')]);
  build(await keyLogo());
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  await render(0);
  return true;
})();
</script>
</body>
</html>
